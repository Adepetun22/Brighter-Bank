<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Map Locator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #d0d0d0;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        #hud-top-left {
            position: fixed;
            top: 16px;
            left: 20px;
            z-index: 10;
            font-size: 11px;
            line-height: 1.6;
            color: #888;
            pointer-events: none;
        }

        #hud-top-left .title {
            color: #ccc;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        #hud-top-left .dim { color: #555; }
        #hud-top-left .accent { color: #aaa; }

        #hud-bottom-left {
            position: fixed;
            bottom: 16px;
            left: 20px;
            z-index: 10;
            font-size: 10px;
            line-height: 1.7;
            color: #555;
            pointer-events: none;
        }

        #hud-bottom-right {
            position: fixed;
            bottom: 16px;
            right: 20px;
            z-index: 10;
            font-size: 10px;
            line-height: 1.7;
            color: #555;
            text-align: right;
            pointer-events: none;
        }

        #location-panel {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 10;
            font-size: 10px;
            line-height: 1.8;
            color: #777;
            text-align: right;
            pointer-events: none;
        }

        #location-panel .loc-name {
            color: #bbb;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        #location-panel .loc-coord { color: #666; }

        .marker-label {
            position: absolute;
            z-index: 15;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #999;
            background: rgba(10, 10, 10, 0.85);
            padding: 3px 7px;
            border: 1px solid #333;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .marker-dot {
            position: absolute;
            z-index: 16;
            width: 5px;
            height: 5px;
            background: #ccc;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .marker-dot.pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(200,200,200,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(200,200,200,0); }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="hud-top-left">
        <div class="title">MAP_LOCATOR v3.1</div>
        <div class="dim">────────────────────</div>
        <div><span class="dim">STATUS:</span> <span class="accent">ONLINE</span></div>
        <div><span class="dim">MODE:</span> <span class="accent">3D_RENDER</span></div>
        <div id="rotation-info"><span class="dim">ROT_Y:</span> <span class="accent">0.00°</span></div>
    </div>

    <div id="location-panel">
        <div class="loc-name" id="active-location">CLICK TO LOCATE</div>
        <div class="loc-coord" id="active-coords">LAT: --  LON: --</div>
        <div class="loc-coord" id="active-info"></div>
    </div>

    <div id="hud-bottom-left">
        <span>[DRAG] ROTATE</span> &nbsp; <span>[SCROLL] ZOOM</span> &nbsp; <span>[CLICK] LOCATE</span>
    </div>

    <div id="hud-bottom-right">
        <span id="fps-counter">-- FPS</span><br>
        <span id="time-display"></span>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ── SCENE ──
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.4, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x0a0a0a);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ── CONTROLS ──
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 2.0;
        controls.maxDistance = 6;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.enablePan = false;

        // ── LIGHTING ──
        scene.add(new THREE.AmbientLight(0x404040, 0.4));
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);
        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-3, -1, -3);
        scene.add(fillLight);

        // ── TEXTURES ──
        const textureLoader = new THREE.TextureLoader();
        const dayTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
        const normalTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');
        const specularTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg');

        // ── EARTH ──
        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(1, 96, 96),
            new THREE.MeshPhongMaterial({
                map: dayTexture,
                normalMap: normalTexture,
                normalScale: new THREE.Vector2(0.6, 0.6),
                specularMap: specularTexture,
                specular: new THREE.Color(0x222222),
                shininess: 60,
            })
        );
        scene.add(earth);

        // ── ATMOSPHERE ──
        const atmosphere = new THREE.Mesh(
            new THREE.SphereGeometry(1.02, 64, 64),
            new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    void main() {
                        float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.5);
                        gl_FragColor = vec4(0.6, 0.7, 0.9, 1.0) * intensity * 0.5;
                    }
                `,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true,
            })
        );
        scene.add(atmosphere);

        // ── WIREFRAME ──
        const wireframe = new THREE.Mesh(
            new THREE.SphereGeometry(1.005, 36, 18),
            new THREE.MeshBasicMaterial({ color: 0x333333, wireframe: true, transparent: true, opacity: 0.15 })
        );
        scene.add(wireframe);

        // ── LOCATIONS ──
        const locations = [
            { id: 'main',      name: 'Main Street Branch', lat: 40.7128, lon: -74.006,  info: '123 Finance Way, Downtown' },
            { id: 'westside',  name: 'Westside Hub',        lat: 40.7282, lon: -73.7949, info: '455 Commerce Ave, Westside' },
            { id: 'plaza',     name: 'The Plaza ATM',       lat: 40.758,  lon: -73.9855, info: '88 Market Square (24/7 Access)' },
            { id: 'northside', name: 'Northside Branch',    lat: 40.761,  lon: -73.9352, info: '900 Corporate Blvd' },
        ];

        function latLonToVec3(lat, lon, radius) {
            const phi   = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                 radius * Math.cos(phi),
                 radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // ── MARKERS ──
        const markerGroup = new THREE.Group();
        scene.add(markerGroup);
        const markerMeshes = [];
        const activeMarkerIndexById = new Map();
        let activeMarkerIndex = -1;

        locations.forEach((loc, i) => {
            activeMarkerIndexById.set(loc.id, i);

            const marker = new THREE.Mesh(
                new THREE.SphereGeometry(0.012, 8, 8),
                new THREE.MeshBasicMaterial({ color: 0xcccccc })
            );
            marker.position.copy(latLonToVec3(loc.lat, loc.lon, 1.01));
            marker.userData = loc;
            markerGroup.add(marker);
            markerMeshes.push(marker);

            const lineGeo = new THREE.BufferGeometry().setFromPoints([
                latLonToVec3(loc.lat, loc.lon, 1.0),
                latLonToVec3(loc.lat, loc.lon, 1.04),
            ]);
            markerGroup.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.6 })));
        });

        // ── ACTIVE PIN ──
        const pinGroup = new THREE.Group();
        markerGroup.add(pinGroup);

        const pinHead = new THREE.Mesh(
            new THREE.SphereGeometry(0.028, 12, 12),
            new THREE.MeshBasicMaterial({ color: 0x04a0ff })
        );
        pinHead.position.set(0, 0.09, 0);
        pinGroup.add(pinHead);

        const pinStem = new THREE.Mesh(
            new THREE.CylinderGeometry(0.004, 0.004, 0.09, 6),
            new THREE.MeshBasicMaterial({ color: 0x04a0ff })
        );
        pinStem.position.set(0, 0.045, 0);
        pinGroup.add(pinStem);

        pinGroup.visible = false;

        function movePinTo(lat, lon) {
            const surface = latLonToVec3(lat, lon, 1.01);
            pinGroup.position.copy(surface);
            // Orient pin outward from globe center
            pinGroup.quaternion.setFromUnitVectors(
                new THREE.Vector3(0, 1, 0),
                surface.clone().normalize()
            );
            pinGroup.visible = true;
        }

        // ── HTML MARKER LABELS ──
        const markerLabelEls = [];
        const markerDotEls = [];
        const container = document.getElementById('canvas-container');

        locations.forEach((loc) => {
            const dot = document.createElement('div');
            dot.className = 'marker-dot pulse';
            container.appendChild(dot);
            markerDotEls.push(dot);

            const label = document.createElement('div');
            label.className = 'marker-label';
            label.textContent = loc.name;
            container.appendChild(label);
            markerLabelEls.push(label);
        });

        function updateMarkerLabels() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            markerMeshes.forEach((mesh, i) => {
                const worldPos = new THREE.Vector3();
                mesh.getWorldPosition(worldPos);
                const camToPoint = camera.position.clone().sub(worldPos).normalize();
                const dotP = worldPos.clone().normalize().dot(camToPoint);

                if (dotP < 0.15) {
                    markerLabelEls[i].style.display = 'none';
                    markerDotEls[i].style.display = 'none';
                    return;
                }

                const projected = worldPos.clone().project(camera);
                const x = (projected.x * 0.5 + 0.5) * w;
                const y = (-projected.y * 0.5 + 0.5) * h;

                if (x < 0 || x > w || y < 0 || y > h) {
                    markerLabelEls[i].style.display = 'none';
                    markerDotEls[i].style.display = 'none';
                    return;
                }

                const opacity = Math.min(1, (dotP - 0.15) * 3);
                markerDotEls[i].style.cssText = `display:block;left:${x}px;top:${y}px;opacity:${opacity}`;
                const showLabel = i === activeMarkerIndex;
                markerLabelEls[i].style.cssText = showLabel
                    ? `display:block;left:${x + 8}px;top:${y - 8}px;opacity:${opacity}`
                    : 'display:none';
            });
        }

        // ── CLICK TO LOCATE ──
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (e) => {
            mouse.x =  (e.clientX / window.innerWidth)  * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hit = raycaster.intersectObject(earth)[0];
            if (!hit) return;
            const n = hit.point.clone().normalize();
            const lat = 90 - Math.acos(n.y) * (180 / Math.PI);
            const lon = Math.atan2(n.z, -n.x) * (180 / Math.PI) - 180;
            const adjLon = lon < -180 ? lon + 360 : lon;
            document.getElementById('active-location').textContent = 'PINNED';
            document.getElementById('active-coords').textContent =
                `LAT: ${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'}  LON: ${Math.abs(adjLon).toFixed(2)}°${adjLon >= 0 ? 'E' : 'W'}`;
        });

        // ── postMessage from React ──
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (!data || data.type !== 'SET_ACTIVE_LOCATION') return;
            const i = activeMarkerIndexById.get(data.id);
            if (i === undefined) return;
            activeMarkerIndex = i;
            const loc = locations[i];
            markerMeshes.forEach((m, idx) => m.material.color.set(idx === i ? 0x04a0ff : 0xcccccc));
            movePinTo(loc.lat, loc.lon);
            animateCameraTo(latLonToVec3(loc.lat, loc.lon, 3.2), loc);
        });

        function animateCameraTo(targetPos, loc) {
            controls.autoRotate = false;
            const start = camera.position.clone();
            const startTime = performance.now();
            const duration = 1200;
            (function step(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
                camera.position.lerpVectors(start, targetPos, ease);
                camera.lookAt(0, 0, 0);
                if (t < 1) { requestAnimationFrame(step); return; }
                controls.autoRotate = true;
                controls.autoRotateSpeed = 0.15;
                document.getElementById('active-location').textContent = loc.name;
                document.getElementById('active-coords').textContent = loc.info;
            })(startTime);
        }

        // ── ANIMATION LOOP ──
        let frameCount = 0, lastFPSTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.001;
            wireframe.rotation.y = earth.rotation.y;
            markerGroup.rotation.y = earth.rotation.y;
            controls.update();

            const rotDeg = ((earth.rotation.y * 180 / Math.PI) % 360).toFixed(2);
            document.getElementById('rotation-info').innerHTML =
                `<span class="dim">ROT_Y:</span> <span class="accent">${rotDeg}°</span>`;

            renderer.render(scene, camera);
            updateMarkerLabels();

            frameCount++;
            const now = performance.now();
            if (now - lastFPSTime > 500) {
                document.getElementById('fps-counter').textContent =
                    Math.round(frameCount / ((now - lastFPSTime) / 1000)) + ' FPS';
                frameCount = 0;
                lastFPSTime = now;
            }

            const d = new Date();
            document.getElementById('time-display').textContent =
                `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} UTC`;
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
        window.parent.postMessage({ type: 'MAP_READY' }, '*');
    </script>
</body>
</html>

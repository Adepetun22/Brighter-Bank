<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Map Locator — Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #d0d0d0;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #ascii-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #ascii-canvas {
            image-rendering: pixelated;
        }

        #hud-top-left {
            position: fixed;
            top: 16px;
            left: 20px;
            z-index: 10;
            font-size: 11px;
            line-height: 1.6;
            color: #888;
            pointer-events: none;
        }

        #hud-top-left .title {
            color: #ccc;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        #hud-top-left .dim { color: #555; }
        #hud-top-left .accent { color: #aaa; }

        #hud-bottom-left {
            position: fixed;
            bottom: 16px;
            left: 20px;
            z-index: 10;
            font-size: 10px;
            line-height: 1.7;
            color: #555;
            pointer-events: none;
        }

        #hud-bottom-right {
            position: fixed;
            bottom: 16px;
            right: 20px;
            z-index: 10;
            font-size: 10px;
            line-height: 1.7;
            color: #555;
            text-align: right;
            pointer-events: none;
        }

        #location-panel {
            position: fixed;
            top: 16px;
            right: 20px;
            z-index: 10;
            font-size: 10px;
            line-height: 1.8;
            color: #777;
            text-align: right;
            pointer-events: none;
        }

        #location-panel .loc-name {
            color: #bbb;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        #location-panel .loc-coord {
            color: #666;
        }

        #search-bar {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 0;
        }

        #search-bar input {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #333;
            border-right: none;
            color: #ccc;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 8px 14px;
            width: 260px;
            outline: none;
        }

        #search-bar input::placeholder {
            color: #444;
        }

        #search-bar input:focus {
            border-color: #555;
        }

        #search-bar button {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #333;
            color: #888;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 8px 14px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        #search-bar button:hover {
            background: rgba(50, 50, 50, 0.9);
            color: #bbb;
        }

        .marker-label {
            position: absolute;
            z-index: 15;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #999;
            background: rgba(10, 10, 10, 0.85);
            padding: 3px 7px;
            border: 1px solid #333;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .marker-dot {
            position: absolute;
            z-index: 16;
            width: 5px;
            height: 5px;
            background: #ccc;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .marker-dot.pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(200,200,200,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(200,200,200,0); }
        }

        #click-label {
            position: fixed;
            z-index: 20;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: #aaa;
            background: rgba(10, 10, 10, 0.9);
            padding: 4px 8px;
            border: 1px solid #444;
            pointer-events: none;
            display: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ascii-overlay">
        <canvas id="ascii-canvas"></canvas>
    </div>

    <div id="hud-top-left">
        <div class="title">MAP_LOCATOR v3.1</div>
        <div class="dim">────────────────────</div>
        <div><span class="dim">STATUS:</span> <span class="accent" id="status-text">ONLINE</span></div>
        <div><span class="dim">MODE:</span> <span class="accent">ASCII_RENDER</span></div>
        <div><span class="dim">PROJ:</span> <span class="accent">SPHERICAL</span></div>
        <div id="rotation-info"><span class="dim">ROT_Y:</span> <span class="accent">0.00°</span></div>
    </div>

    <div id="location-panel">
        <div class="loc-name" id="active-location">CLICK TO LOCATE</div>
        <div class="loc-coord" id="active-coords">LAT: --  LON: --</div>
        <div class="loc-coord" id="active-info"></div>
    </div>

    <div id="hud-bottom-left">
        <span>[DRAG] ROTATE</span> &nbsp; <span>[SCROLL] ZOOM</span> &nbsp; <span>[CLICK] LOCATE</span>
    </div>

    <div id="hud-bottom-right">
        <span id="fps-counter">60 FPS</span><br>
        <span id="time-display"></span>
    </div>

    <div id="search-bar">
        <input type="text" id="search-input" placeholder="> search location..." />
        <button id="search-btn">GO</button>
    </div>

    <div id="click-label"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ── SCENE ──
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.4, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); // keep low for ASCII aesthetic
        renderer.setClearColor(0x0a0a0a);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        renderer.domElement.style.display = 'none'; // hide, we show ASCII

        // ── CONTROLS ──
        // Use a dedicated transparent overlay for orbit controls so it doesn't interfere with the ascii canvas context
        const controlsOverlay = document.createElement('div');
        controlsOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:6;';
        document.body.appendChild(controlsOverlay);
        const controls = new OrbitControls(camera, controlsOverlay);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 2.0;
        controls.maxDistance = 6;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.enablePan = false;

        // ── LIGHTING ──
        const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
        ambientLight.name = 'ambientLight1';
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        sunLight.position.set(5, 3, 5);
        sunLight.name = 'sunLight1';
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-3, -1, -3);
        fillLight.name = 'fillLight1';
        scene.add(fillLight);

        // ── TEXTURES ──
        const textureLoader = new THREE.TextureLoader();

        const dayTexture = textureLoader.load(
            'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg'
        );
        const normalTexture = textureLoader.load(
            'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg'
        );
        const specularTexture = textureLoader.load(
            'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg'
        );

        // ── EARTH ──
        const earthGeometry = new THREE.SphereGeometry(1, 96, 96);
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: dayTexture,
            normalMap: normalTexture,
            normalScale: new THREE.Vector2(0.6, 0.6),
            specularMap: specularTexture,
            specular: new THREE.Color(0x222222),
            shininess: 60,
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earth.name = 'earth1';
        scene.add(earth);

        // ── ATMOSPHERE ──
        const atmosphereGeo = new THREE.SphereGeometry(1.02, 64, 64);
        const atmosphereMat = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.5);
                    gl_FragColor = vec4(0.6, 0.7, 0.9, 1.0) * intensity * 0.5;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true,
        });
        const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
        atmosphere.name = 'atmosphere1';
        scene.add(atmosphere);

        // ── WIREFRAME OVERLAY ──
        const wireGeo = new THREE.SphereGeometry(1.005, 36, 18);
        const wireMat = new THREE.MeshBasicMaterial({
            color: 0x333333,
            wireframe: true,
            transparent: true,
            opacity: 0.15,
        });
        const wireframe = new THREE.Mesh(wireGeo, wireMat);
        wireframe.name = 'wireframe1';
        scene.add(wireframe);

        // ── LOCATION DATA ──
        const locations = [
            { name: 'NEW YORK', lat: 40.7128, lon: -74.006, info: '40.71°N 74.01°W' },
            { name: 'LONDON', lat: 51.5074, lon: -0.1278, info: '51.51°N 0.13°W' },
            { name: 'TOKYO', lat: 35.6762, lon: 139.6503, info: '35.68°N 139.65°E' },
            { name: 'SYDNEY', lat: -33.8688, lon: 151.2093, info: '33.87°S 151.21°E' },
            { name: 'SAO PAULO', lat: -23.5505, lon: -46.6333, info: '23.55°S 46.63°W' },
            { name: 'CAIRO', lat: 30.0444, lon: 31.2357, info: '30.04°N 31.24°E' },
            { name: 'MUMBAI', lat: 19.076, lon: 72.8777, info: '19.08°N 72.88°E' },
            { name: 'BEIJING', lat: 39.9042, lon: 116.4074, info: '39.90°N 116.41°E' },
            { name: 'LAGOS', lat: 6.5244, lon: 3.3792, info: '6.52°N 3.38°E' },
            { name: 'MEXICO CITY', lat: 19.4326, lon: -99.1332, info: '19.43°N 99.13°W' },
        ];

        function latLonToVec3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // Create 3D marker points
        const markerGroup = new THREE.Group();
        markerGroup.name = 'markerGroup1';
        scene.add(markerGroup);

        const markerMeshes = [];
        locations.forEach((loc, i) => {
            const pos = latLonToVec3(loc.lat, loc.lon, 1.01);
            const markerGeo = new THREE.SphereGeometry(0.012, 8, 8);
            const markerMat = new THREE.MeshBasicMaterial({ color: 0xcccccc });
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.position.copy(pos);
            marker.name = `marker_${loc.name.replace(/\s/g, '_')}_${i}`;
            marker.userData = loc;
            markerGroup.add(marker);
            markerMeshes.push(marker);

            // Thin line from surface
            const innerPos = latLonToVec3(loc.lat, loc.lon, 1.0);
            const outerPos = latLonToVec3(loc.lat, loc.lon, 1.04);
            const lineGeo = new THREE.BufferGeometry().setFromPoints([innerPos, outerPos]);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.6 });
            const line = new THREE.Line(lineGeo, lineMat);
            line.name = `markerLine_${i}`;
            markerGroup.add(line);
        });

        // ── ASCII RENDERER ──
        const asciiCanvas = document.getElementById('ascii-canvas');
        let asciiCtx = null;
        const offscreen = document.createElement('canvas');
        let offCtx = null;

        function initCanvasContexts() {
            asciiCtx = asciiCanvas.getContext('2d');
            offCtx = offscreen.getContext('2d', { willReadFrequently: true });
            if (!asciiCtx || !offCtx) {
                console.warn('Canvas context not ready, retrying...');
                requestAnimationFrame(initCanvasContexts);
            }
        }
        initCanvasContexts();

        // ASCII character ramp from dark to light
        const ASCII_CHARS = ' .·:;!=+*#%@';
        const CHAR_W = 6;
        const CHAR_H = 10;

        let cols, rows;

        function resizeASCII() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            cols = Math.floor(w / CHAR_W);
            rows = Math.floor(h / CHAR_H);
            offscreen.width = cols;
            offscreen.height = rows;
            asciiCanvas.width = w;
            asciiCanvas.height = h;
            asciiCanvas.style.width = w + 'px';
            asciiCanvas.style.height = h + 'px';
            renderer.setSize(cols * 2, rows * 2); // low-res render
        }

        resizeASCII();

        // ── HTML MARKER LABELS ──
        const markerLabelEls = [];
        const markerDotEls = [];
        const container = document.getElementById('canvas-container');

        locations.forEach((loc, i) => {
            const dot = document.createElement('div');
            dot.className = 'marker-dot pulse';
            container.appendChild(dot);
            markerDotEls.push(dot);

            const label = document.createElement('div');
            label.className = 'marker-label';
            label.textContent = loc.name;
            container.appendChild(label);
            markerLabelEls.push(label);
        });

        function updateMarkerLabels() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            markerMeshes.forEach((mesh, i) => {
                const worldPos = new THREE.Vector3();
                mesh.getWorldPosition(worldPos);

                // Check if visible (facing camera)
                const camDir = worldPos.clone().normalize();
                const camToPoint = camera.position.clone().sub(worldPos).normalize();
                const dotP = camDir.dot(camToPoint);

                if (dotP < 0.15) {
                    markerLabelEls[i].style.display = 'none';
                    markerDotEls[i].style.display = 'none';
                    return;
                }

                const projected = worldPos.clone().project(camera);
                const x = (projected.x * 0.5 + 0.5) * w;
                const y = (-projected.y * 0.5 + 0.5) * h;

                if (x < 0 || x > w || y < 0 || y > h) {
                    markerLabelEls[i].style.display = 'none';
                    markerDotEls[i].style.display = 'none';
                    return;
                }

                markerDotEls[i].style.display = 'block';
                markerDotEls[i].style.left = x + 'px';
                markerDotEls[i].style.top = y + 'px';

                markerLabelEls[i].style.display = 'block';
                markerLabelEls[i].style.left = (x + 8) + 'px';
                markerLabelEls[i].style.top = (y - 8) + 'px';
                markerLabelEls[i].style.opacity = Math.min(1, (dotP - 0.15) * 3);
                markerDotEls[i].style.opacity = Math.min(1, (dotP - 0.15) * 3);
            });
        }

        // ── CLICK TO LOCATE ──
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const clickLabel = document.getElementById('click-label');

        controlsOverlay.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(earth);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                const normalized = point.clone().normalize();

                const lat = 90 - Math.acos(normalized.y) * (180 / Math.PI);
                const lon = Math.atan2(normalized.z, -normalized.x) * (180 / Math.PI) - 180;
                const adjLon = lon < -180 ? lon + 360 : lon;

                const latStr = Math.abs(lat).toFixed(2) + '°' + (lat >= 0 ? 'N' : 'S');
                const lonStr = Math.abs(adjLon).toFixed(2) + '°' + (adjLon >= 0 ? 'E' : 'W');

                document.getElementById('active-location').textContent = 'PINNED';
                document.getElementById('active-coords').textContent = `LAT: ${latStr}  LON: ${lonStr}`;

                clickLabel.style.display = 'block';
                clickLabel.style.left = (e.clientX + 12) + 'px';
                clickLabel.style.top = (e.clientY - 12) + 'px';
                clickLabel.textContent = `${latStr} ${lonStr}`;

                setTimeout(() => { clickLabel.style.display = 'none'; }, 2500);
            }
        });

        // ── SEARCH ──
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');

        function doSearch() {
            const query = searchInput.value.trim().toUpperCase();
            if (!query) return;

            const found = locations.find(l => l.name.includes(query));
            if (found) {
                const target = latLonToVec3(found.lat, found.lon, 3.2);
                animateCameraTo(target, found);
            } else {
                document.getElementById('active-location').textContent = 'NOT FOUND';
                document.getElementById('active-coords').textContent = `"${query}"`;
            }
            searchInput.value = '';
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        function animateCameraTo(targetPos, loc) {
            controls.autoRotate = false;
            const start = camera.position.clone();
            const duration = 1200;
            const startTime = performance.now();

            function step(now) {
                const t = Math.min((now - startTime) / duration, 1);
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                camera.position.lerpVectors(start, targetPos, ease);
                camera.lookAt(0, 0, 0);
                if (t < 1) requestAnimationFrame(step);
                else {
                    controls.autoRotate = true;
                    controls.autoRotateSpeed = 0.15;
                    document.getElementById('active-location').textContent = loc.name;
                    document.getElementById('active-coords').textContent = loc.info;
                }
            }
            requestAnimationFrame(step);
        }

        // ── FPS ──
        let frameCount = 0;
        let lastFPSTime = performance.now();

        // ── TIME ──
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time-display').textContent = `${h}:${m}:${s} UTC`;
        }

        // ── ANIMATION LOOP ──
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            earth.rotation.y += 0.001;
            wireframe.rotation.y = earth.rotation.y;
            markerGroup.rotation.y = earth.rotation.y;

            controls.update();

            // Update HUD
            const rotDeg = ((earth.rotation.y * 180 / Math.PI) % 360).toFixed(2);
            document.getElementById('rotation-info').innerHTML =
                `<span class="dim">ROT_Y:</span> <span class="accent">${rotDeg}°</span>`;

            // Render to offscreen at low res
            renderer.render(scene, camera);

            // Only draw ASCII if contexts are ready
            if (asciiCtx && offCtx) {
                // Read pixels
                offCtx.drawImage(renderer.domElement, 0, 0, cols, rows);
                const imageData = offCtx.getImageData(0, 0, cols, rows);
                const data = imageData.data;

                // Draw ASCII
                asciiCtx.fillStyle = '#0a0a0a';
                asciiCtx.fillRect(0, 0, asciiCanvas.width, asciiCanvas.height);
                asciiCtx.font = `${CHAR_H}px 'JetBrains Mono', monospace`;
                asciiCtx.textBaseline = 'top';

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        const idx = (y * cols + x) * 4;
                        const r = data[idx];
                        const g = data[idx + 1];
                        const b = data[idx + 2];
                        const brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;

                        if (brightness < 0.02) continue; // skip near-black

                        const charIdx = Math.floor(brightness * (ASCII_CHARS.length - 1));
                        const char = ASCII_CHARS[charIdx];

                        // Tint based on original color, desaturated
                        const maxC = Math.max(r, g, b, 1);
                        const nr = Math.floor((r / maxC) * 180 + 60);
                        const ng = Math.floor((g / maxC) * 180 + 60);
                        const nb = Math.floor((b / maxC) * 180 + 60);

                        asciiCtx.fillStyle = `rgb(${nr},${ng},${nb})`;
                        asciiCtx.fillText(char, x * CHAR_W, y * CHAR_H);
                    }
                }
            }

            updateMarkerLabels();

            // FPS
            frameCount++;
            const now = performance.now();
            if (now - lastFPSTime > 500) {
                const fps = Math.round(frameCount / ((now - lastFPSTime) / 1000));
                document.getElementById('fps-counter').textContent = fps + ' FPS';
                frameCount = 0;
                lastFPSTime = now;
            }

            updateTime();
        }

        // ── RESIZE ──
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            resizeASCII();
        });

        animate();
    </script>
</body>
</html>
